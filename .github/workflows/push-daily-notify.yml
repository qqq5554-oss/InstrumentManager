name: Daily Push Notify

on:
  schedule:
    - cron: '0 8 * * *'  # 每天 16:00 台灣時間（UTC+8）掃描逾期與預約衝突
  workflow_dispatch:       # 允許手動觸發測試

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notify-event scan
        run: |
          curl -s -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/notify-event" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"scan": true}'
